<div class="form-section">
  <form (ngSubmit)="modifyCoach()" autocomplete="off">
    <h2 class="form-title">Coach</h2>
    <div class="form-group">
      <label for="photo">Foto / logo</label>
      <input id="photo" type="file" [(ngModel)]="photo" (change)="onPhotoSelected($event)" name="photo" style="display: none;">
      <label for="photo" class="btn-main custom-file-label">Seleccionar foto / logo</label>
      <img *ngIf="photoPreview" [src]="photoPreview" class="photo-preview" alt="Vista previa">
    </div>
    <div class="form-group">
      <label for="presentation">Especialidad</label>
      <input id="presentation" type="text" [(ngModel)]="presentation" name="presentation" required placeholder="Ej: Nutrición, Entrenamiento, etc.">
    </div>
    <div class="form-group">
      <label for="phonenumber">Teléfono</label>
      <input id="phonenumber" type="text" [(ngModel)]="phonenumber" name="phonenumber" placeholder="Ej: 600123456">
    </div>
    <div class="form-group checkbox-group">
      <input id="isNutritionist" type="checkbox" [(ngModel)]="isNutritionist" name="isNutritionist">
      <label for="isNutritionist">Nutricionista</label>
    </div>
    <div class="form-group checkbox-group">
      <input id="isFitness" type="checkbox" [(ngModel)]="isFitness" name="isFitness">
      <label for="isFitness">Entrenador Fitness</label>
    </div>
    <div class="form-group">
      <input type="hidden" [(ngModel)]="user" name="user" value="{{user}}">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn-main">Guardar</button>
    </div>
    <div *ngIf="error" class="error">{{ error }}</div>
  </form>
</div>
