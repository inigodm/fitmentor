<div class="form-section">
    <h2 class="form-title">Cliente</h2>
    <div class="form-group">
      <label>Objetivos</label>
    </div>
  <div class="form-group">
    <label>{{ goals }}</label>
  </div>
  <div class="form-group">
      <label>Edad</label>
  </div>
  <div class="form-group">
    <label>{{ age }}</label>
  </div>
  <div class="form-group">
    <label>Peso</label>
  </div>
  <div class="form-group">
    <label>{{ weight }}</label>
  </div>
  <div class="form-group">
    <label>Acceso a equipo
      <input type="checkbox" value="$equipmentAccess"/>
    </label>
  </div>
  <div class="form-group">
    <label>Tipo de entreno preferido</label>
  </div>
  <div class="form-group">
    <label>{{ preferedTrainingStyle }}</label>
  </div>
  <div class="form-group">
    <label>Teléfono</label>
  </div>
  <div class="form-group">
    <label>{{ phonenumber }}</label>
  </div>

  <div class="form-actions">
      <button (click)="registerWithBiometrics()">Registrar huella</button>
    </div>
</div>
