spring.application.name: fitmentor
spring:
    h2:
        console:
            enabled: true
            path: /h2-console
    datasource:
        url: jdbc:h2:mem:base
        driver-class-name: org.h2.Driver
        username: sa
        password:
    flyway:
        locations: classpath:db/migration
        enabled: true
    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                type:
                    trace: true
                format_sql: true
                dialect: org.hibernate.dialect.H2Dialect
    main:
        allow-bean-definition-overriding: true
server:
    port: 0
jwt:
    secret: |
        random string dfsdfenrñjweugb
        must be a long string in order to 
        have more than 256 bytes, so I think that I should 
        write some more characters here: 
        lets see: 1, 2, 3
    issuer: "fitmentor"
    audience: "user"
    header: Authorization
    prefix: Bearer
    token-type: JWT
logging:
    level:
        org:
            springframework:
                web: DEBUG
                security: DEBUG