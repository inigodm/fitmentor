spring.application.name: fitmentor
spring:
  cache:
    type: caffeine
    cache-names: foods
    caffeine:
      spec: maximumSize=500,expireAfterAccess=600s
      caches:
        foods:
          spec: maximumSize=500,expireAfterAccess=6000s
  datasource:
      url: ${SPRING_DATASOURCE_URL}
      username: ${SPRING_DATASOURCE_USERNAME}
      password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
      locations: classpath:db/migration
      enabled: true
  main:
      allow-bean-definition-overriding: true
server:
    port: 8443
    ssl:
      enabled: true
      key-store: classpath:fitmentor.com.p12
      key-store-password: fitmentor_change_it
      key-store-type: PKCS12
jwt:
    secret: |
        random string dfsdfenrñjweugb
        must be a long string in order to 
        have more than 256 bytes, so I think that I should 
        write some more characters here: 
        lets see: 1, 2, 3
    issuer: "fitmentor"
    audience: "user"
    header: Authorization
    prefix: Bearer
    token-type: JWT